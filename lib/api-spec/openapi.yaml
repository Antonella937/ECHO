openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: universe
    description: Private social universe owned by the authenticated user
  - name: storage
    description: Private image upload and serving
paths:
  /ai-engine/preview:
    post:
      operationId: previewCharacterDecision
      summary: Manual text-only character decision; never executes or persists social actions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterDecisionInput" }
      responses:
        "200":
          description: Validated dry-run proposal from owner-scoped persisted character data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterDecisionPreview" }
        "400": { description: Invalid input or unavailable target }
        "401": { description: Authentication required }
        "404": { description: Character or universe not found for this owner }
        "429": { description: Another preview is running or cooldown active }
        "502": { description: Provider failure or invalid model output; no action executed }
        "503": { description: Provider is not configured }
  /ai-engine/vision/analyze:
    post:
      operationId: analyzeOwnerImageMedia
      summary: Analyze persisted owner-uploaded post/story images; videos and audio are excluded
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisionAnalyzeInput" }
      responses:
        "200":
          description: Persisted per-image results and ordered post summary; repeat requests reuse completed analyses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisionAnalysisResponse" }
        "401": { description: Authentication required }
        "404": { description: "Owner universe, post, story, or owned media not found" }
        "409": { description: The same image is currently being analyzed }
        "413": { description: Image exceeds the analysis size limit }
        "415": { description: "Unsupported media type; only PNG, JPEG, and WebP images are analyzed" }
        "422": { description: Invalid media reference or structured model result }
        "502": { description: Storage or provider failure; no social action is executed }
        "503": { description: No free image-capable model is available }
  /autonomy/settings:
    get:
      operationId: getAutonomySettings
      summary: Load owner-private text autonomy controls
      parameters:
        - name: universeId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 120, default: primary }
      responses:
        "200":
          description: Owner controls and per-character opt-ins; live execution remains disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomySettings" }
        "401": { description: Authentication required }
        "404": { description: No owner universe exists }
    put:
      operationId: updateAutonomySettings
      summary: Update the owner's kill switch or one character's explicit opt-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomySettingsUpdate" }
      responses:
        "200":
          description: Updated owner-private controls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomySettings" }
        "400": { description: Invalid control update }
        "401": { description: Authentication required }
        "404": { description: Character or owner universe not found }
  /autonomy/dry-run:
    post:
      operationId: runAutonomyDryRun
      summary: Run one owner-requested text autonomy simulation without social writes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomyDryRunInput" }
      responses:
        "200":
          description: Dry-run result; no post, comment, or message was executed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomyDryRunResult" }
        "400": { description: Invalid input or unavailable character }
        "401": { description: Authentication required }
        "404": { description: Character or owner universe not found }
        "409": { description: Duplicate request already in progress or universe changed during preview }
        "429": { description: Owner or character dry-run rate limit reached }
        "502": { description: Free provider failure or invalid model output }
        "503": { description: No free provider is configured }
  /characters/assistance:
    get:
      operationId: getCharacterAssistance
      summary: Owner-private character proposal provider availability
      responses:
        "200":
          description: Assistance status, without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterAssistanceStatus" }
        "401": { description: Authentication required }
    post:
      operationId: proposeCharacter
      summary: Propose an editable character without creating or activating it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterProposalInput" }
      responses:
        "200":
          description: Reviewable proposal; saving requires explicit owner confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterProposal" }
        "401": { description: Authentication required }
        "503": { description: No assistance provider configured; no generation performed }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /universe:
    get:
      operationId: getUniverse
      tags: [universe]
      summary: Load the authenticated user's universe
      parameters:
        - name: universeId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Universe, or null when the account has not been initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseEnvelope"
        "401":
          description: Authentication required
    put:
      operationId: saveUniverse
      tags: [universe]
      summary: Save the authenticated user's universe
      parameters:
        - name: universeId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniverseInput"
      responses:
        "409":
          description: Stale revision; reload and safely merge before retrying
        "200":
          description: Saved universe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseEnvelope"
        "400":
          description: Invalid universe
        "401":
          description: Authentication required
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlInput"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResult"
        "400":
          description: Invalid image metadata
        "401":
          description: Authentication required
  /storage/uploads/claim:
    post:
      operationId: claimUpload
      tags: [storage]
      summary: Mark a completed upload as private to its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadClaimInput"
      responses:
        "200":
          description: Private object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadClaimResult"
        "400":
          description: Invalid object path
        "401":
          description: Authentication required
  /universe/verify:
    get:
      operationId: verifyUniverse
      tags: [universe]
      summary: Re-read the saved universe and verify every private image is readable
      parameters:
        - name: universeId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Verified universe and private images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseVerification"
        "401":
          description: Authentication required
        "422":
          description: A saved file could not be verified
  /creator/account:
    get:
      operationId: getCreatorAccount
      tags: [creator]
      summary: Load owner-scoped plan, structural capacity and monthly AI usage
      responses:
        "200":
          description: Internal plan state and actual usage; billing is not connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorAccount" }
        "401": { description: Authentication required }
  /creator/ai-budget:
    put:
      operationId: configureCreatorAiBudget
      tags: [creator]
      summary: Configure an internal weighted usage ceiling and autonomy reserve
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatorAiBudgetInput" }
      responses:
        "200":
          description: Updated owner-only internal budget configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorAccount" }
        "400": { description: Invalid budget configuration }
        "401": { description: Authentication required }
  /creator/universes/{universeId}/management:
    put:
      operationId: manageCreatorUniverse
      tags: [creator]
      summary: Owner-only universe edit, archive, restore or confirmed deletion
      parameters:
        - name: universeId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniverseManagementInput" }
      responses:
        "200":
          description: Committed universe operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniverseManagementResult" }
        "400": { description: Invalid input or confirmation }
        "401": { description: Authentication required }
        "404": { description: Universe unavailable }
        "409": { description: Stale revision or last available universe }
  /creator/universes:
    get:
      operationId: listCreatorUniverses
      tags: [creator]
      summary: List the authenticated owner's universes and character counts
      parameters:
        - name: universeId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Owner-only universe summaries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CreatorUniverseSummary" } }
        "401": { description: Authentication required }
    post:
      operationId: createCreatorUniverse
      tags: [creator]
      summary: Create another owner-scoped universe within structural capacity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatorUniverseInput" }
      responses:
        "201":
          description: Created owner-scoped universe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorUniverseCreated" }
        "400": { description: Invalid universe data }
        "401": { description: Authentication required }
        "409": { description: Universe or character capacity reached }
  /storage/objects/{objectPath}:
    get:
      operationId: getPrivateObject
      tags: [storage]
      summary: Serve an image only to its universe owner
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "403":
          description: Not the object owner
        "404":
          description: Image not found
components:
  schemas:
    AiUsageCategory:
      type: string
      enum: [autonomy, brain_text, memory_context, vision, images]
    AiUsageCategoryWeight:
      type: object
      required: [autonomy, brain_text, memory_context, vision, images]
      properties:
        autonomy: { type: integer, minimum: 1, maximum: 10000 }
        brain_text: { type: integer, minimum: 1, maximum: 10000 }
        memory_context: { type: integer, minimum: 1, maximum: 10000 }
        vision: { type: integer, minimum: 1, maximum: 10000 }
        images: { type: integer, minimum: 1, maximum: 10000 }
    AiUsageCategorySummary:
      type: object
      required: [calls, units, promptTokens, completionTokens, reportedCost]
      properties:
        calls: { type: integer, minimum: 0 }
        units: { type: integer, minimum: 0 }
        promptTokens: { type: integer, minimum: 0 }
        completionTokens: { type: integer, minimum: 0 }
        reportedCost: { type: ["string", "null"] }
    CreatorAiUsage:
      type: object
      required: [month, categories, totalUnits]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        categories:
          type: object
          required: [autonomy, brain_text, memory_context, vision, images]
          properties:
            autonomy: { $ref: "#/components/schemas/AiUsageCategorySummary" }
            brain_text: { $ref: "#/components/schemas/AiUsageCategorySummary" }
            memory_context: { $ref: "#/components/schemas/AiUsageCategorySummary" }
            vision: { $ref: "#/components/schemas/AiUsageCategorySummary" }
            images: { $ref: "#/components/schemas/AiUsageCategorySummary" }
        totalUnits: { type: integer, minimum: 0 }
    CreatorAccount:
      type: object
      required: [plan, billingStatus, maxUniverses, maxCharacters, addonUniverses, addonCharacters, universeCount, characterCount, usage]
      properties:
        plan: { type: string, enum: [free, creator] }
        billingStatus: { type: string, enum: [not_connected] }
        maxUniverses: { type: integer, minimum: 1 }
        maxCharacters: { type: integer, minimum: 1 }
        addonUniverses: { type: integer, minimum: 0 }
        addonCharacters: { type: integer, minimum: 0 }
        universeCount: { type: integer, minimum: 0 }
        characterCount: { type: integer, minimum: 0 }
        usage: { $ref: "#/components/schemas/CreatorAiUsage" }
    UniverseManagementInput:
      type: object
      additionalProperties: false
      required: [action, expectedRevision]
      properties:
        action: { type: string, enum: [edit, archive, restore, delete] }
        expectedRevision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 500 }
        confirmationText: { type: string, maxLength: 80 }
    UniverseManagementResult:
      type: object
      required: [revision, archived, deleted]
      properties:
        revision: { type: integer }
        archived: { type: boolean }
        deleted: { type: boolean }
        fallbackUniverseId: { type: [string, "null"] }
    CreatorUniverseSummary:
      type: object
      required: [universeId, name, revision, characterCount, current]
      properties:
        universeId: { type: string }
        name: { type: string }
        revision: { type: integer, minimum: 0 }
        characterCount: { type: integer, minimum: 0 }
        current: { type: boolean }
        description: { type: string }
        archived: { type: boolean }
    CreatorUniverseInput:
      type: object
      required: [name, state]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        state: { $ref: "#/components/schemas/SocialState" }
    CreatorUniverseCreated:
      type: object
      required: [universeId, revision, state]
      properties:
        universeId: { type: string }
        revision: { type: integer, minimum: 1 }
        state: { $ref: "#/components/schemas/SocialState" }
    CreatorAiBudgetInput:
      type: object
      required: [monthlyHardCeilingUnits, autonomyReservePercent, categoryWeights]
      properties:
        monthlyHardCeilingUnits: { type: integer, minimum: 1, maximum: 500 }
        autonomyReservePercent: { type: integer, minimum: 20, maximum: 90 }
        categoryWeights: { $ref: "#/components/schemas/AiUsageCategoryWeight" }
    AutonomyCharacterControl:
      type: object
      required: [characterId, displayName, username, enabled, maxActionsPerDay, minCooldownMinutes]
      properties:
        characterId: { type: string }
        displayName: { type: string }
        username: { type: string }
        enabled: { type: boolean }
        maxActionsPerDay: { type: integer, minimum: 1, maximum: 4 }
        minCooldownMinutes: { type: integer, minimum: 60, maximum: 1440 }
    AutonomySettings:
      type: object
      required: [universeId, globalKillSwitchEngaged, liveExecutionEnabled, characters]
      properties:
        universeId: { type: string, minLength: 1, maxLength: 120 }
        globalKillSwitchEngaged: { type: boolean }
        liveExecutionEnabled: { type: boolean, enum: [false] }
        characters:
          type: array
          items: { $ref: "#/components/schemas/AutonomyCharacterControl" }
    AutonomySettingsUpdate:
      oneOf:
        - type: object
          additionalProperties: false
          required: [globalKillSwitchEngaged]
          properties:
            globalKillSwitchEngaged: { type: boolean }
            universeId: { type: string, minLength: 1, maxLength: 120, default: primary }
        - type: object
          additionalProperties: false
          required: [characterId, enabled]
          properties:
            characterId: { type: string, minLength: 1, maxLength: 120 }
            enabled: { type: boolean }
            universeId: { type: string, minLength: 1, maxLength: 120, default: primary }
    AutonomyDryRunInput:
      type: object
      additionalProperties: false
      required: [characterId, idempotencyKey]
      properties:
        characterId: { type: string, minLength: 1, maxLength: 120 }
        idempotencyKey: { type: string, format: uuid }
        universeId: { type: string, minLength: 1, maxLength: 120, default: primary }
    AutonomyDryRunResult:
      type: object
      required: [mode, runId, characterId, status, liveExecutionEnabled, liveEligible, socialActionsExecuted, reason, preview, createdAt]
      properties:
        mode: { type: string, enum: [dry_run] }
        runId: { type: [string, "null"] }
        characterId: { type: string }
        status: { type: string, enum: [previewed, no_opportunity, cooldown, rate_limited, duplicate, in_progress] }
        liveExecutionEnabled: { type: boolean, enum: [false] }
        liveEligible: { type: boolean }
        socialActionsExecuted: { type: boolean, enum: [false] }
        reason: { type: string, maxLength: 300 }
        targetId: { type: [string, "null"] }
        preview:
          oneOf:
            - $ref: "#/components/schemas/CharacterDecisionPreview"
            - type: "null"
        createdAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UniverseEnvelope:
      type: object
      required: [state, revision]
      properties:
        revision: { type: integer, minimum: 0 }
        state:
          oneOf:
            - $ref: "#/components/schemas/SocialState"
            - type: "null"
    UniverseInput:
      type: object
      required: [state, expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        state:
          $ref: "#/components/schemas/SocialState"
    UniverseVerification:
      allOf:
        - $ref: "#/components/schemas/UniverseEnvelope"
        - type: object
          required: [verifiedFiles]
          properties:
            verifiedFiles: { type: integer, minimum: 0 }
    SocialState:
      type: object
      required: [version, currentCharacterId, characters, follows, posts, comments, stories, messages, notifications]
      properties:
        appearance: { $ref: "#/components/schemas/Appearance" }
        highlights: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/StoryHighlight" } }
        accountCatalogVersion: { type: integer, minimum: 0 }
        creatorSetup: { $ref: "#/components/schemas/CreatorSetup" }
        version: { type: integer }
        currentCharacterId: { type: string }
        characters:
          type: array
          items: { $ref: "#/components/schemas/Character" }
        follows:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        stories:
          type: array
          items: { $ref: "#/components/schemas/Story" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
    CreatorSetup:
      type: object
      required: [plan, universeName, completedAt]
      properties:
        universeDescription: { type: string, maxLength: 500 }
        plan: { type: string, enum: [free, creator] }
        universeName: { type: string, minLength: 1, maxLength: 60 }
        completedAt: { type: string, format: date-time }
    Character:
      type: object
      required: [id, handle, name, occupation, bio, location, avatar, providerRef, identity]
      properties:
        configuration: { $ref: "#/components/schemas/CharacterConfiguration" }
        accountType: { type: string, enum: [personal, band, venue, organization] }
        verified: { type: boolean }
        archived: { type: boolean }
        displayMetrics:
          type: object
          properties:
            followers: { type: [integer, "null"], minimum: 0, maximum: 1000000000000 }
            following: { type: [integer, "null"], minimum: 0, maximum: 1000000000000 }
        id: { type: string }
        handle: { type: string }
        name: { type: string }
        occupation: { type: string }
        bio: { type: string }
        location: { type: string }
        avatar: { type: string }
        providerRef:
          type: object
          required: [provider, externalId, status, lastSyncAt]
          properties:
            provider: { type: string }
            externalId: { type: [string, "null"] }
            status: { type: string }
            lastSyncAt: { type: [string, "null"], format: date-time }
        identity:
          type: object
          required: [provider, referenceImages, seed, appearance, styleNotes, updatedAt]
          properties:
            provider: { type: string }
            referenceImages:
              type: array
              items: { type: string }
            seed: { type: integer }
            appearance: { type: string }
            styleNotes: { type: string }
            updatedAt: { type: string, format: date-time }
    CharacterAssistanceStatus:
      type: object
      required: [available, reason]
      properties:
        available: { type: boolean }
        reason: { type: string }
    CharacterProposalInput:
      type: object
      required: [description]
      properties:
        description: { type: string, minLength: 10, maxLength: 8000 }
    CharacterProposal:
      type: object
      required: [name, handle, bio, occupation, location, configuration]
      properties:
        name: { type: string }
        handle: { type: string }
        bio: { type: string }
        occupation: { type: string }
        location: { type: string }
        configuration: { $ref: "#/components/schemas/CharacterConfiguration" }
    CharacterDecisionInput:
      type: object
      additionalProperties: false
      required: [characterId, situation]
      properties:
        characterId: { type: string, minLength: 1, maxLength: 120 }
        situation: { type: string, enum: [post, comment, dm, like_post, like_comment, story_reaction, dm_reaction] }
        universeId: { type: string, minLength: 1, maxLength: 120, description: "Owner-selected universe for this preview; defaults to primary." }
        postId: { type: string, minLength: 1, maxLength: 120 }
        commentId: { type: string, minLength: 1, maxLength: 120 }
        recipientId: { type: string, minLength: 1, maxLength: 120 }
        storyId: { type: string, minLength: 1, maxLength: 120 }
        messageId: { type: string, minLength: 1, maxLength: 120 }
    CharacterDecision:
      type: object
      additionalProperties: false
      required: [action, situation, text, reason, suggestedDelayMinutes, contextSections]
      properties:
        action: { type: string, enum: [none, draft, like, react] }
        situation: { type: string, enum: [post, comment, dm, like_post, like_comment, story_reaction, dm_reaction] }
        text: { type: [string, "null"], maxLength: 2000 }
        reason: { type: string, minLength: 1, maxLength: 400, description: Brief explanation, not hidden reasoning }
        suggestedDelayMinutes: { type: integer, minimum: 0, maximum: 10080 }
        reaction: { type: [string, "null"], maxLength: 32 }
        contextSections:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { type: string, enum: [identity, personality, relationships, routine, social, memory, currentState, recentSocial] }
    CharacterDecisionPreview:
      type: object
      required: [mode, executed, characterId, sourceRevision, provider, model, decision, availableContextSections, warnings, contextAudit, usage, attempts]
      properties:
        mode: { type: string, enum: [preview] }
        executed: { type: boolean, enum: [false] }
        characterId: { type: string }
        sourceRevision: { type: integer, minimum: 0 }
        provider: { type: string }
        model: { type: string }
        decision: { $ref: "#/components/schemas/CharacterDecision" }
        availableContextSections: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        contextAudit: { $ref: "#/components/schemas/CharacterContextAudit" }
        usage: { $ref: "#/components/schemas/EngineUsage" }
        attempts: { type: array, items: { $ref: "#/components/schemas/EngineAttempt" } }
        targetId: { type: [string, "null"] }
    EngineUsage:
      type: object
      required: [promptTokens, completionTokens, cost]
      properties:
        promptTokens: { type: [integer, "null"], minimum: 0 }
        completionTokens: { type: [integer, "null"], minimum: 0 }
        cost: { type: [number, "null"], minimum: 0, description: Provider-reported USD; null means not reported, not zero }
    EngineAttempt:
      type: object
      required: [model, outcome, code, usage]
      properties:
        model: { type: string }
        outcome: { type: string, enum: [success, failure, skipped] }
        code: { type: [string, "null"] }
        usage: { $ref: "#/components/schemas/EngineUsage" }
    CharacterContextSection:
      type: object
      required: [name, hasContent, recordCount, fields]
      properties:
        name: { type: string }
        hasContent: { type: boolean, description: Meaningful content, not merely an empty/default object }
        recordCount: { type: integer, minimum: 0 }
        fields: { type: array, items: { type: string }, description: Included field paths only; never private field values }
    CharacterContextAudit:
      type: object
      required: [source, contextHash, characterId, sourceRevision, sections, recentCounts, privateDmScope, visionMediaIncluded, visionPostSummariesIncluded]
      properties:
        source: { type: string, enum: [persisted_owner_universe, provided_snapshot] }
        contextHash: { type: string, description: SHA-256 of the exact bounded text context, including evaluation time }
        characterId: { type: string }
        sourceRevision: { type: integer, minimum: 0 }
        sections: { type: array, items: { $ref: "#/components/schemas/CharacterContextSection" } }
        recentCounts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        privateDmScope: { type: string, enum: [none, actor_and_recipient_only] }
        visionMediaIncluded: { type: integer, minimum: 0, description: Count of persisted per-item vision analyses included; no image bytes or URLs }
        visionPostSummariesIncluded: { type: integer, minimum: 0, description: Count of persisted ordered post summaries included }
    VisionAnalysisResponse:
      type: object
      required: [entityType, entityId, summary, items, skippedVideoCount]
      properties:
        entityType: { type: string, enum: [post, story] }
        entityId: { type: string }
        summary: { oneOf: [{ $ref: "#/components/schemas/VisionPostSummary" }, { type: "null" }] }
        items: { type: array, items: { $ref: "#/components/schemas/VisionAnalyzedMediaItem" } }
        skippedVideoCount: { type: integer, minimum: 0 }
    VisionAnalyzeInput:
      oneOf:
        - type: object
          required: [postId]
          additionalProperties: false
          properties:
            postId: { type: string, minLength: 1, maxLength: 120 }
            universeId: { type: string, minLength: 1, maxLength: 120, default: primary }
        - type: object
          required: [storyId]
          additionalProperties: false
          properties:
            storyId: { type: string, minLength: 1, maxLength: 120 }
            universeId: { type: string, minLength: 1, maxLength: 120, default: primary }
    VisionAnalyzedMediaItem:
      type: object
      required: [mediaId, position, analysisId, analysis, provider, model, cacheHit, attempts, usage]
      properties:
        mediaId: { type: string }
        position: { type: integer, minimum: 0 }
        analysisId: { type: string }
        analysis: { $ref: "#/components/schemas/VisionAnalysis" }
        provider: { type: string }
        model: { type: string }
        cacheHit: { type: boolean }
        attempts: { type: array, items: { $ref: "#/components/schemas/VisionAttempt" } }
        usage: { $ref: "#/components/schemas/EngineUsage" }
    VisionAttempt:
      type: object
      required: [model, outcome, errorCode, usage]
      properties:
        model: { type: string }
        outcome: { type: string, enum: [accepted, rejected] }
        errorCode: { type: [string, "null"] }
        usage: { $ref: "#/components/schemas/EngineUsage" }
    VisionAnalysis:
      type: object
      additionalProperties: false
      required: [sceneDescription, setting, objects, people, activities, dominantColors, visibleText, notableDetails, uncertainty]
      properties:
        sceneDescription: { type: string, minLength: 8, maxLength: 1400 }
        setting: { type: string, maxLength: 320 }
        objects:
          type: array
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required: [label, category, attributes, position, confidence]
            properties:
              label: { type: string, minLength: 1, maxLength: 120 }
              category: { type: string, enum: [object, person, animal, text, setting, other] }
              attributes: { type: array, maxItems: 8, items: { type: string, maxLength: 320 } }
              position: { type: string, enum: [foreground, center, background, left, right, top, bottom, unknown] }
              confidence: { type: number, minimum: 0, maximum: 1 }
        people:
          type: object
          additionalProperties: false
          required: [count, nonIdentifyingDetails]
          properties:
            count: { type: integer, minimum: 0, maximum: 40 }
            nonIdentifyingDetails: { type: array, maxItems: 8, items: { type: string, maxLength: 320 } }
        activities: { type: array, maxItems: 20, items: { type: string, maxLength: 320 } }
        dominantColors: { type: array, maxItems: 12, items: { type: string, minLength: 1, maxLength: 120 } }
        visibleText: { type: array, maxItems: 20, items: { type: string, maxLength: 320 } }
        notableDetails: { type: array, maxItems: 24, items: { type: string, maxLength: 320 } }
        uncertainty: { type: array, maxItems: 12, items: { type: string, maxLength: 320 } }
    VisionPostSummary:
      type: object
      required: [postId, caption, imageCount, unsupportedImageCount, unsupportedVideoCount, orderedItems, overallDescription]
      properties:
        postId: { type: string }
        caption: { type: string, maxLength: 500 }
        imageCount: { type: integer, minimum: 0 }
        unsupportedImageCount: { type: integer, minimum: 0 }
        unsupportedVideoCount: { type: integer, minimum: 0 }
        overallDescription: { type: string, maxLength: 12000 }
        orderedItems:
          type: array
          items:
            type: object
            required: [mediaId, position, description, objects, colors]
            properties:
              mediaId: { type: string }
              position: { type: integer, minimum: 0 }
              description: { type: string, maxLength: 1400 }
              objects: { type: array, items: { type: string, maxLength: 120 } }
              colors: { type: array, items: { type: string, maxLength: 120 } }
    CharacterConfiguration:
      type: object
      required: [version, basic, personality, voice, relationships, routine, social, memory, currentState, assistance]
      properties:
        version: { type: integer, enum: [1] }
        basic:
          type: object
          required: [name, age, pronouns, interests, likes, dislikes, notes]
          properties:
            name: { type: string, maxLength: 100 }
            age: { type: [integer, "null"], minimum: 0, maximum: 150 }
            pronouns: { type: string, maxLength: 100 }
            interests: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
            likes: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
            dislikes: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
            notes: { type: string, maxLength: 8000 }
        personality:
          type: object
          required: [description, traits, temperament, values, humor, sociability, expressiveness, emotionalStyle, commonTopics, boundaries]
          properties:
            description: { type: string, maxLength: 24000 }
            traits: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
            temperament: { type: string, maxLength: 2000 }
            values: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
            humor: { type: string, maxLength: 2000 }
            sociability: { type: string, enum: [low, medium, high] }
            expressiveness: { type: string, maxLength: 2000 }
            emotionalStyle: { type: string, maxLength: 4000 }
            commonTopics: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
            boundaries: { type: array, maxItems: 50, items: { type: string, maxLength: 1000 } }
        voice:
          type: object
          required: [speakingStyle, messageLength, vocabulary, emojiStyle, captionStyle, commentStyle, disclosure, postsAbout, avoidsPosting]
          properties:
            speakingStyle: { type: string, maxLength: 4000 }
            messageLength: { type: string, enum: [short, balanced, long] }
            vocabulary: { type: string, maxLength: 4000 }
            emojiStyle: { type: string, maxLength: 2000 }
            captionStyle: { type: string, maxLength: 4000 }
            commentStyle: { type: string, maxLength: 4000 }
            disclosure: { type: string, enum: [private, balanced, open] }
            postsAbout: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
            avoidsPosting: { type: array, maxItems: 50, items: { type: string, maxLength: 500 } }
        relationships:
          type: array
          maxItems: 300
          items: { $ref: "#/components/schemas/CharacterRelationship" }
        routine:
          type: object
          required: [timezone, flexibilityNotes, entries]
          properties:
            timezone: { type: string, maxLength: 100 }
            flexibilityNotes: { type: string, maxLength: 4000 }
            entries: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/RoutineEntry" } }
        social:
          type: object
          required: [activity, postsFrequency, storiesFrequency, likesFrequency, commentsFrequency, initiatesDMs, replySpeed, sociability, spontaneity, allowSilence, silenceNotes, postsPerWeek, storiesPerWeek, minReplyMinutes, maxReplyMinutes]
          properties:
            activity: { type: string, enum: [low, medium, high] }
            postsFrequency: { type: string, enum: [rare, normal, frequent] }
            storiesFrequency: { type: string, enum: [rare, normal, frequent] }
            likesFrequency: { type: string, enum: [rare, normal, frequent] }
            commentsFrequency: { type: string, enum: [rare, normal, frequent] }
            initiatesDMs: { type: string, enum: [rare, normal, frequent] }
            replySpeed: { type: string, enum: [slow, normal, quick] }
            sociability: { type: string, enum: [low, medium, high] }
            spontaneity: { type: string, enum: [low, medium, high] }
            allowSilence: { type: boolean }
            silenceNotes: { type: string, maxLength: 4000 }
            postsPerWeek: { type: [integer, "null"], minimum: 0, maximum: 100 }
            storiesPerWeek: { type: [integer, "null"], minimum: 0, maximum: 300 }
            minReplyMinutes: { type: [integer, "null"], minimum: 0, maximum: 10080 }
            maxReplyMinutes: { type: [integer, "null"], minimum: 0, maximum: 10080 }
        memory:
          type: object
          required: [permanent, relationships, recent, recentLimit, recentSummary]
          properties:
            permanent: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/CharacterMemory" } }
            relationships: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/CharacterMemory" } }
            recent: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/CharacterMemory" } }
            recentLimit: { type: integer, minimum: 10, maximum: 200 }
            recentSummary: { type: string, maxLength: 8000 }
        currentState:
          type: object
          required: [location, activity, mood, companions, lastActivityAt, nextEvent, source, updatedAt]
          properties:
            location: { type: string, maxLength: 500 }
            activity: { type: string, maxLength: 1000 }
            mood: { type: string, maxLength: 500 }
            companions: { type: array, maxItems: 50, items: { type: string } }
            lastActivityAt: { type: [string, "null"], format: date-time }
            nextEvent: { type: string, maxLength: 1000 }
            source: { type: string, enum: [manual, routine] }
            updatedAt: { type: string, format: date-time }
        assistance:
          type: object
          required: [description, status, provider]
          properties:
            description: { type: string, maxLength: 8000 }
            status: { type: string, enum: [manual, unavailable, proposed, accepted] }
            provider: { type: [string, "null"] }
    CharacterRelationship:
      type: object
      required: [id, targetId, preset, customLabel, description, closeness, trust, attraction, tension]
      properties:
        id: { type: string }
        targetId: { type: string, description: "'owner' denotes the universe owner, never a login credential" }
        preset: { type: string, enum: [stranger, acquaintance, friend, close_friend, family, crush, romantic_tension, partner, ex, rival, custom] }
        customLabel: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 8000 }
        closeness: { type: integer, minimum: 0, maximum: 100 }
        trust: { type: integer, minimum: 0, maximum: 100 }
        attraction: { type: [integer, "null"], minimum: 0, maximum: 100 }
        tension: { type: [integer, "null"], minimum: 0, maximum: 100 }
    RoutineEntry:
      type: object
      required: [id, title, activity, weekdays, start, end, location, recurrence, date, flexibility]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 200 }
        activity: { type: string, enum: [sleep, work, study, meal, exercise, rehearsal, social, leisure, custom] }
        weekdays: { type: array, maxItems: 7, items: { type: integer, minimum: 1, maximum: 7 } }
        start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        end: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        location: { type: string, maxLength: 500 }
        recurrence: { type: string, enum: [weekly, once] }
        date: { type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        flexibility: { type: string, enum: [low, medium, high] }
    CharacterMemory:
      type: object
      required: [id, text, targetId, createdAt, updatedAt, kind, sourceId, promotedTo]
      properties:
        id: { type: string }
        text: { type: string, minLength: 1, maxLength: 8000 }
        targetId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        kind: { type: string, enum: [manual, interaction, post, conversation, event] }
        sourceId: { type: [string, "null"] }
        promotedTo: { type: [string, "null"] }
    Appearance:
      type: object
      required: [theme, accent]
      properties:
        theme: { type: string, enum: [dark, light, system] }
        accent: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    SocialReaction:
      type: object
      required: [id, actorId, value]
      properties:
        id: { type: string }
        actorId: { type: string }
        value: { type: string, minLength: 1, maxLength: 32 }
    MessageAttachment:
      type: object
      required: [id, type, url]
      properties:
        id: { type: string }
        type: { type: string, enum: [image, video, audio] }
        url: { type: string, minLength: 1 }
        mimeType: { type: string }
        durationSeconds: { type: number, minimum: 0 }
    StoryHighlight:
      type: object
      required: [id, authorId, title, storyIds]
      properties:
        id: { type: string }
        authorId: { type: string }
        title: { type: string, minLength: 1, maxLength: 40 }
        storyIds: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        order: { type: integer, minimum: 0, maximum: 199, description: "Optional identity-scoped manual order; legacy collections retain their stored order." }
        coverStoryId: { type: [string, "null"], description: "A Story in this collection, or null for an automatic cover." }
    StoryMusic:
      type: object
      description: Metadata only; no music provider, audio stream or playback is connected.
      required: [title, artist]
      properties:
        title: { type: string, maxLength: 160 }
        artist: { type: string, maxLength: 160 }
        providerRef: { type: string, maxLength: 300 }
    PostMedia:
      type: object
      description: Ordered post item. Stable IDs link images to owner-scoped persisted Vision v1 analysis; video analysis is not included.
      required: [id, type, url]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [image, video] }
        url: { type: string, minLength: 1 }
        mimeType: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        durationSeconds: { type: number, minimum: 0 }
    Post:
      type: object
      required: [id, authorId, image, caption, location, createdAt, likes, savedBy, origin, illustrative]
      properties:
        taggedAccountIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string } }
        commentsEnabled: { type: boolean }
        pinned: { type: boolean }
        pinOrder: { type: integer, minimum: 0, maximum: 2, description: "Manual order of pinned posts within their author identity. Absent for legacy or unpinned posts." }
        editedAt: { type: string, format: date-time }
        displayMetrics:
          type: object
          properties:
            likes: { type: [integer, "null"], minimum: 0, maximum: 1000000000000 }
            comments: { type: [integer, "null"], minimum: 0, maximum: 1000000000000 }
            views: { type: [integer, "null"], minimum: 0, maximum: 1000000000000 }
        id: { type: string }
        authorId: { type: string }
        image: { type: string }
        media:
          type: array
          minItems: 1
          maxItems: 10
          description: Optional additive carousel; array order is display order. image remains its first item's URL for legacy covers.
          items: { $ref: "#/components/schemas/PostMedia" }
        caption: { type: string }
        location: { type: string }
        createdAt: { type: string, format: date-time }
        likes: { type: array, items: { type: string } }
        savedBy: { type: array, items: { type: string } }
        origin: { type: string }
        illustrative: { type: boolean }
    Comment:
      type: object
      required: [id, postId, authorId, text, createdAt, parentId, replyToAuthorId, likes, origin]
      properties:
        id: { type: string }
        postId: { type: string }
        authorId: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        parentId: { type: [string, "null"] }
        replyToAuthorId: { type: [string, "null"] }
        likes: { type: array, items: { type: string } }
        origin: { type: string }
    Story:
      type: object
      required: [id, authorId, image, caption, createdAt, seenBy, origin]
      properties:
        displayMetrics:
          type: object
          properties:
            views: { type: [integer, "null"], minimum: 0, maximum: 1000000000000, description: "Optional narrative base, added to unique real viewers. Absence/null means zero; never creates viewers." }
        mentionedAccountIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string } }
        reactions: { type: array, items: { $ref: "#/components/schemas/SocialReaction" } }
        music: { $ref: "#/components/schemas/StoryMusic" }
        id: { type: string }
        authorId: { type: string }
        image: { type: string }
        caption: { type: string }
        createdAt: { type: string, format: date-time }
        seenBy: { type: array, items: { type: string } }
        origin: { type: string }
    Message:
      type: object
      required: [id, threadId, senderId, recipientId, text, createdAt, storyId, postId, readBy, origin]
      properties:
        hiddenForIds: { type: array, uniqueItems: true, maxItems: 2, items: { type: string } }
        quoteMessageId: { type: string }
        attachments: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/MessageAttachment" } }
        reactions: { type: array, items: { $ref: "#/components/schemas/SocialReaction" } }
        id: { type: string }
        threadId: { type: string }
        senderId: { type: string }
        recipientId: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        storyId: { type: [string, "null"] }
        postId: { type: [string, "null"] }
        readBy: { type: array, items: { type: string } }
        origin: { type: string }
    Notification:
      type: object
      required: [id, recipientId, actorId, kind, postId, commentId, storyId, excerpt, createdAt, read]
      properties:
        id: { type: string }
        recipientId: { type: string }
        actorId: { type: string }
        kind: { type: string }
        postId: { type: [string, "null"] }
        commentId: { type: [string, "null"] }
        storyId: { type: [string, "null"] }
        excerpt: { type: string }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    UploadUrlInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        size: { type: integer, minimum: 1, maximum: 52428800 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/webm, audio/webm, audio/ogg, audio/mp4, audio/mpeg, audio/wav] }
    UploadUrlResult:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    UploadClaimInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, minLength: 1 }
    UploadClaimResult:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }

