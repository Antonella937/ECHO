name: ECHO typecheck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server exec tsx --test tests/cloudflare-r2-offline.test.ts
      - run: pnpm --filter @workspace/api-server run test:support
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/echo run build
