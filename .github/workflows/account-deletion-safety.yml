name: Account deletion safety checks

on:
  push:
    paths:
      - 'artifacts/api-server/src/lib/accountDeletionPlan.ts'
      - 'artifacts/api-server/tests/account-deletion-plan.test.ts'
      - 'artifacts/api-server/src/lib/accountDeletionExecutor.ts'
      - 'artifacts/api-server/tests/account-deletion-executor.test.ts'
      - '.github/workflows/account-deletion-safety.yml'
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/accountDeletionPlan.ts'
      - 'artifacts/api-server/tests/account-deletion-plan.test.ts'
      - 'artifacts/api-server/src/lib/accountDeletionExecutor.ts'
      - 'artifacts/api-server/tests/account-deletion-executor.test.ts'
      - '.github/workflows/account-deletion-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-planner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ''
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      CLERK_SECRET_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pure, no-network deletion planning tests
        run: pnpm --filter @workspace/api-server exec tsx --test tests/account-deletion-plan.test.ts tests/account-deletion-executor.test.ts
