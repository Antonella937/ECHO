name: ECHO external build preparation (no deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build ECHO frontend
        run: pnpm --filter @workspace/echo run build
      - name: Build ECHO API
        run: pnpm --filter @workspace/api-server run build
      - name: Validate API Docker image (no push or deploy)
        run: docker build --file Dockerfile.echo-api --tag echo-api:build-check .
      - name: Save build outputs for inspection
        uses: actions/upload-artifact@v4
        with:
          name: echo-build-${{ github.sha }}
          path: |
            artifacts/echo/dist/
            artifacts/api-server/dist/
          retention-days: 3
          if-no-files-found: error
