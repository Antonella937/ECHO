name: ECHO scheduled post wake-up
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake ECHO API so due posts can run
        run: |
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 5 "https://echo-private-beta-api.onrender.com/api/healthz" > /dev/null
