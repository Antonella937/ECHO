name: ECHO autonomy offline tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  autonomy-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run autonomous worker regression tests (no database or AI calls)
        run: pnpm --filter @workspace/api-server exec tsx --test tests/autonomy-worker-offline.test.ts
