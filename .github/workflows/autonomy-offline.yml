name: ECHO autonomy offline tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  autonomy-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run autonomous worker regression tests (no database or AI calls)
        run: pnpm --filter @workspace/api-server exec tsx --test tests/autonomy-worker-offline.test.ts tests/autonomy-social-offline.test.ts tests/autonomy-event-memory-offline.test.ts tests/incoming-memory-offline.test.ts tests/memory-archive-offline.test.ts
        env:
          # Offline tests import the executor, which initializes a lazy pg Pool.
          # This is a non-routable placeholder; no SQL calls are made.
          DATABASE_URL: postgres://offline:offline@127.0.0.1:1/offline
