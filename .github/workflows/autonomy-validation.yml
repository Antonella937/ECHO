name: Autonomy validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/**'
      - 'artifacts/api-server/tests/autonomy.test.ts'
      - 'artifacts/api-server/tests/kindroid-groups.test.ts'
      - 'artifacts/api-server/package.json'
      - 'artifacts/api-server/tsconfig.autonomy-tests.json'
      - '.github/workflows/autonomy-validation.yml'

jobs:
  autonomy-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspace libraries
        run: pnpm run typecheck:libs
      - name: Typecheck autonomy tests
        run: pnpm --filter @workspace/api-server typecheck:autonomy-tests
      - name: Run Kindroid group isolation tests
        run: pnpm --filter @workspace/api-server test:kindroid-groups
