kind = "web"
previewPath = "/"
title = "ECHO"
description = "A private, mobile-first fictional character social universe for Nela Paez, with secure sign-in, cross-device persistence, stories, profiles and conversations."
version = "1.0.0"
id = "artifacts/echo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23641

[services.development]
run = "pnpm --filter @workspace/echo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/echo", "run", "build" ]
serve = "static"
publicDir = "artifacts/echo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23641"
BASE_PATH = "/"
